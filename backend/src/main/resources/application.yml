server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: simple-todo-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/simple_todo}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  level:
    org.springframework.web: DEBUG

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
